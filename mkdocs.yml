site_name: The Agency
site_description: 300 specialized AI agents for development, design, and operations
site_url: https://deuriib.github.io/agency-agents/
repo_name: deuriib/agency-agents
repo_url: https://github.com/deuriib/agency-agents
docs_dir: site-docs/docs
site_dir: site
theme:
  name: material
  language: en
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
extra:
  alternate:
  - name: English
    link: /agency-agents/
    lang: en
  - name: Español
    link: /agency-agents/es/
    lang: es
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/deuriib/agency-agents
  attribution: Based on the upstream project msitarzewski/agency-agents
plugins:
- search
- i18n:
    docs_structure: folder
    fallback_to_default: true
    languages:
    - locale: en
      name: English
      default: true
      build: true
    - locale: es
      name: Español
      build: true
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.inlinehilite
- tables
- attr_list
- toc
