[project]
name = "agency-agents"
version = "1.6.0"
description = "A catalog of specialized AI agent personas, rendered and installed across AI coding tools through a Python CLI."
readme = "README.md"
authors = [{ name = "Deuri Vasquez", email = "deuriib@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
agency-agents = "agency_agents:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.8.0",
    "yamllint>=1.35.0",
]

[tool.pytest.ini_options]
testpaths = ["src/agency_agents/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/agency_agents"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 1

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Deliberately narrow baseline: only rules that catch real breakage.
# Expansion is tracked per rule, never with blanket noqa directives.
select = ["E9", "F63", "F7", "F82", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/agency_agents"]
warn_unused_ignores = true
warn_redundant_casts = true
