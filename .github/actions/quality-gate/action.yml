name: Quality gate
description: >-
  Lint, type-check, and test the project with uv. Shared by ci.yml and
  release.yml so the two gates cannot drift apart.

inputs:
  coverage:
    description: Run the test suite with coverage collection and the coverage floor.
    required: false
    default: "false"
  python-version:
    description: Python version to install.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Sync dependencies
      shell: bash
      run: uv sync --frozen

    - name: Lint
      shell: bash
      run: uv run ruff check .

    - name: Type-check
      # Non-blocking until Wave 3 of repo-standards-baseline (C19 wave plan).
      # The [tool.mypy] strict config already exists; the codebase is not clean yet.
      continue-on-error: true
      shell: bash
      run: uv run mypy src/agency_agents

    - name: Test
      if: inputs.coverage != 'true'
      shell: bash
      run: uv run pytest -q

    - name: Test with coverage floor
      if: inputs.coverage == 'true'
      shell: bash
      run: |
        uv run pytest -q \
          --cov=agency_agents \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=80
