name: Bug report
description: Report a defect in the CLI, a renderer, the installer, or an agent file.
title: "fix: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not include secrets,
        tokens, or personal data in this report.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Converter / renderer
        - Installer
        - Agent file content
        - CI / release automation
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agency-agents --version`, or the git tag you are on.
      placeholder: "1.4.1"
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Affected tool target
      description: Only if the defect is specific to one integration.
      placeholder: "claude-code, cursor, antigravity, …"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `agency-agents install --tool ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste the error output. Redact paths that reveal personal information.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python:
        uv:
        Install method:
    validations:
      required: false
