name: New agent request
description: Propose a new agent for the roster.
title: "feat(agents): "
labels: ["type: feature", "area: agents", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting an agent, check the catalog. The roster already covers
        a wide range of divisions, and a request that duplicates an existing
        agent will be closed with a pointer to it.

  - type: input
    id: name
    attributes:
      label: Proposed agent name
      placeholder: "Database Reliability Engineer"
    validations:
      required: true

  - type: dropdown
    id: division
    attributes:
      label: Division
      options:
        - academic
        - design
        - engineering
        - finance
        - game-development
        - gis
        - healthcare
        - marketing
        - paid-media
        - product
        - project-management
        - research
        - sales
        - security
        - spatial-computing
        - specialized
        - support
        - testing
        - new division (explain below)
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: What gap does this agent fill?
      description: Name the task that no existing agent handles well, and why.
    validations:
      required: true

  - type: textarea
    id: overlap
    attributes:
      label: Existing agents it overlaps with
      description: List the closest agents and explain how this one differs.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Representative deliverables
      description: Three concrete artifacts this agent would produce.
    validations:
      required: false
