# Single source of truth for repository labels.
# Applied by scripts/github/sync_labels.py through .github/workflows/labels-sync.yml.
# Every label carries a category prefix so the issue list can be filtered by axis.

# --- type: what kind of change is this -------------------------------------
- name: "type: bug"
  color: "d73a4a"
  description: "Something is broken or behaves incorrectly"
- name: "type: feature"
  color: "0e8a16"
  description: "New capability that does not exist today"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation, guides or the docs site"
- name: "type: refactor"
  color: "5319e7"
  description: "Internal change with no behaviour difference"
- name: "type: chore"
  color: "ededed"
  description: "Tooling, dependencies or maintenance"

# --- area: which part of the repository ------------------------------------
- name: "area: agents"
  color: "1d76db"
  description: "Agent definitions and the catalog"
- name: "area: cli"
  color: "1d76db"
  description: "The agency-agents command line interface"
- name: "area: converter"
  color: "1d76db"
  description: "Renderers and per-tool conversion"
- name: "area: installer"
  color: "1d76db"
  description: "Installation into tool-specific destinations"
- name: "area: ci"
  color: "1d76db"
  description: "GitHub Actions, releases and repository automation"
- name: "area: docs-site"
  color: "1d76db"
  description: "The MkDocs documentation site"

# --- priority: how urgent --------------------------------------------------
- name: "priority: critical"
  color: "b60205"
  description: "Blocks release or breaks users in production"
- name: "priority: high"
  color: "d93f0b"
  description: "Should land in the next release"
- name: "priority: medium"
  color: "fbca04"
  description: "Scheduled, not urgent"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

# --- status: where it is in the flow --------------------------------------
- name: "status: needs-triage"
  color: "e4e669"
  description: "Not yet reviewed by a maintainer"
- name: "status: blocked"
  color: "000000"
  description: "Waiting on a dependency or a decision"
- name: "status: in-progress"
  color: "0052cc"
  description: "Actively being worked on"
- name: "status: needs-review"
  color: "8b5cf6"
  description: "Waiting for a reviewer"

# --- contribution entry points --------------------------------------------
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-scoped, suitable for a first contribution"
- name: "help wanted"
  color: "008672"
  description: "Maintainers would welcome outside help"

# --- legacy and automation labels ------------------------------------------
# Declared so labels.yml is a complete source of truth: nothing in the
# repository is left unmanaged. The sync is additive and never deletes, so
# these survive even when release-please or GitHub creates them first.

- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "invalid"
  color: "e4e669"
  description: "This does not seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "autorelease: pending"
  color: "ededed"
  description: "Release PR opened by release-please and not yet merged"
- name: "autorelease: tagged"
  color: "ededed"
  description: "Release PR merged and tagged by release-please"
