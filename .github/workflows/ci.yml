name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Agent catalog lint
        run: uv run python -m agency_agents lint
      - name: Runbook structural gate
        # Ratchet: the baseline file excuses legacy docs, and may only shrink.
        run: uv run python scripts/ci/check_runbook_structure.py

  types:
    name: types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: mypy ratchet
        # Fails when production type errors grow above .github/mypy-baseline.
        run: bash scripts/ci/mypy_ratchet.sh

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Pytest with coverage floor
        run: |
          set -euo pipefail
          uv run pytest -q \
            --cov=agency_agents \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

  verify-manifest:
    name: verify-manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Verify conversion outputs
        run: uv run python -m agency_agents verify --all

  documented-commands:
    name: documented-commands
    # M8: every command the docs tell a newcomer to run is executed here. A
    # documented command that no job runs is a command nobody has proven works —
    # which is how `agency-agents --help` shipped broken while 222 tests passed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap (golden path step 2)
        run: ./scripts/bootstrap.sh
      - name: Bootstrap is idempotent
        run: ./scripts/bootstrap.sh
      - name: Console script answers (golden path step 5)
        # The installed entry point, not `python -m`: they are different
        # surfaces and only this one was broken.
        run: uv run agency-agents --help
      - name: Runbook listing
        run: uv run agency-agents install --list runbooks
      - name: Runbook dry-run install
        # The runbook this repository rides on must be installable by its own CLI.
        run: |
          uv run agency-agents install \
            --runbook developer-experience-platform \
            --tool claude-code --dry-run
      - name: Gate listing (golden path step 3)
        run: ./scripts/gate.sh --list
      - name: Catalog lint fails on an inconsistency
        # D2: the gate used to print an error and exit 0. Asserting the exit code
        # is what stops a report that disagrees with its status from shipping.
        run: ./scripts/ci/assert_lint_fails.sh

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Dependency audit
        run: |
          set -euo pipefail
          # Audit the exported runtime requirements, not the environment: the
          # project itself is installed editable and is not on PyPI, which makes
          # an environment-wide audit fail on its own distribution.
          uv export --format requirements-txt --no-dev --no-emit-project \
            --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict -r "$RUNNER_TEMP/requirements.txt" \
            --progress-spinner off
      - name: Workflow and config lint
        run: uv run yamllint -d relaxed .github/

  required:
    name: ci/required
    needs: [lint, types, test, verify-manifest, security, documented-commands]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "At least one required job failed"
            exit 1
          fi
          echo "All required jobs succeeded"
