name: Project Quality Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Tools, and Divisions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"

      - name: Install Dependencies
        run: uv sync

      - name: Run Linting
        run: uv run python -m agency_agents lint

      - name: Verify Hash Manifest
        run: uv run python -m agency_agents verify --all

      - name: Run Tests
        run: uv run pytest src/agency_agents/tests

  antigravity-staging:
    name: Stage Antigravity Bundle
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.12"

      - name: Install Dependencies
        run: uv sync

      - name: Render Bundle
        run: |
          set -euo pipefail
          for tool in antigravity pi-agent oh-my-pi; do
            uv run python -m agency_agents convert --tool "$tool" --out "$RUNNER_TEMP/bundle"
          done

      - name: Install into Staging HOME
        env:
          HOME: ${{ runner.temp }}/staging-home
        run: |
          set -euo pipefail
          for tool in antigravity pi-agent oh-my-pi; do
            uv run python -m agency_agents install --tool "$tool" --no-interactive --scope user
          done

      - name: Assert Staged Artifacts
        env:
          HOME: ${{ runner.temp }}/staging-home
        run: |
          set -euo pipefail
          agents_dir="$HOME/.gemini/config/agents"
          main="$agents_dir/agents-orchestrator.md"
          sub="$agents_dir/frontend-developer.md"

          test -f "$main"
          test -f "$sub"

          # Main agent: promoted, with the delegation surface.
          grep -q "mainAgent: true" "$main"
          grep -q "invoke_subagent" "$main"
          ! grep -q "subagent: true" "$main"

          # Subagent: execution surface only, no delegation tools.
          grep -q "subagent: true" "$sub"
          ! grep -qE "invoke_subagent|manage_subagents|send_message|manage_task" "$sub"

          # Every staged agent declares a tools list.
          for file in "$agents_dir"/*.md; do
            grep -q "^tools: \[" "$file"
          done

          # Pi Agent and Oh My Pi use the gemini-md renderer.
          for path in "$HOME/.pi/agent/agents" "$HOME/.omp/agent/agents"; do
            test -f "$path/agents-orchestrator.md"
            test -f "$path/frontend-developer.md"
            grep -q "^name: " "$path/frontend-developer.md"
          done

          echo "staged $(find "$agents_dir" -name '*.md' | wc -l) antigravity agents, plus pi-agent and oh-my-pi"

      - name: Upload Staging Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antigravity-staging-bundle
          path: ${{ runner.temp }}/bundle
          retention-days: 7
