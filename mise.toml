[tools]
python = "3.13"
uv = "0.12.12"

# ---------------------------------------------------------------------------
# Quality gates. `mise run ci` must reproduce the GitHub Actions gate exactly.
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Lint Python, workflow YAML, the agent catalog and runbook doctrine"
run = [
    "uv run ruff check .",
    "uv run yamllint -d relaxed .github/",
    "uv run python -m agency_agents lint",
    "uv run python scripts/ci/check_runbook_structure.py",
]

[tasks.types]
description = "Type-check with mypy and fail if errors grow past the baseline"
run = "bash scripts/ci/mypy_ratchet.sh"

[tasks.test]
description = "Run the test suite without coverage"
run = "uv run pytest -q"

[tasks.coverage]
description = "Run tests with coverage and enforce the 80% floor"
run = "uv run pytest -q --cov=agency_agents --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tasks.verify]
description = "Verify conversion outputs, the bundled catalog, and version sync"
run = [
    "uv run python -m agency_agents verify --all",
    "uv run python scripts/sync_catalog_data.py --check",
    "uv run python scripts/ci/check_version_sync.py",
]

[tasks.security]
description = "Audit runtime dependencies and lint workflow YAML"
run = [
    "uv export --format requirements-txt --no-dev --no-emit-project --no-hashes -o /tmp/agency-agents-requirements.txt",
    "uv run pip-audit --strict -r /tmp/agency-agents-requirements.txt --progress-spinner off",
    "uv run yamllint -d relaxed .github/",
]

[tasks.check]
description = "Full local gate: lint, types, coverage, security and manifest verification"
depends = ["lint", "types", "coverage", "security", "verify"]

[tasks.ci]
description = "Alias of check: the local gate mirrors the GitHub Actions gate"
depends = ["check"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tasks.hooks]
description = "Install the git hooks managed by pre-commit"
run = "uv run pre-commit install"

[tasks.hooks-run]
description = "Run every pre-commit hook against the whole tree"
run = "uv run pre-commit run --all-files"

[tasks.version]
description = "Print the version release-please will use as its baseline"
run = "uv run python -c \"import agency_agents; print(agency_agents.__version__)\""

# ---------------------------------------------------------------------------
# Agent catalog operations
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install agents for all tools (non-interactive)"
run = "uv run python -m agency_agents install --no-interactive"

[tasks.install-interactive]
description = "Interactive wizard for agent installation"
run = "uv run python -m agency_agents install --interactive"

[tasks.update-manifest]
description = "Regenerate the SHA256 manifest for claude-code"
run = "uv run python -m agency_agents update-manifest claude-code"

[tasks.check-originality]
description = "Flag agent files that substantially duplicate an existing agent"
run = "uv run python -m agency_agents check-originality"

[tasks.convert]
description = "Generate integration files for all tools into ./integrations"
run = "uv run python -m agency_agents convert"

[tasks.full-pipeline]
description = "Lint, test, verify, install and convert end to end"
depends = ["check", "install", "convert"]
run = "echo Pipeline completed successfully!"
